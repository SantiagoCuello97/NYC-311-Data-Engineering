version: 2

models:
  - name: fct_service_requests
    description: >
      One row per request with closure and resolution-time metrics.
      Resolution hours are null when required dates are missing
      or the closure timestamp precedes creation.
    columns:
      - name: request_id
        description: Unique NYC 311 service request ID.
        data_tests:
          - unique
          - not_null

      - name: is_closed
        description: True when a closed_at timestamp is present.
        data_tests:
          - not_null

      - name: has_invalid_dates
        description: True when closed_at precedes created_at.
        data_tests:
          - not_null